name: Release

# Gera o instalador do Memoteca (E16).
#
# - Uma tag `v*` (por exemplo `v0.1.0`) valida o formato e a versão, gera o instalador NSIS e
#   cria uma release em RASCUNHO com o instalador anexado. Quem publica é o mantenedor, depois
#   de olhar o rascunho. Tag com formato inválido ou com versão diferente da do código para no
#   primeiro job e não gera release.
# - Um pull request que mexe nos arquivos de empacotamento gera o instalador só como artefato
#   da execução (sem release), para o instalador não quebrar sem ninguém notar.
# - Não há assinatura de código por enquanto (decisão da E16): nenhum segredo é usado. O
#   Windows pode alertar ao abrir o instalador (SmartScreen), e o README explica.
# Usa `pull_request` (e não `pull_request_target`): forks rodam sem segredos e sem escrita.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/icons/**"
      - "src-tauri/instalador/**"
      - "identidade/**"

# Permissões mínimas. Só o job `publicar` recebe escrita, e só ele.
permissions:
  contents: read

jobs:
  validar:
    name: Validar a tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Conferir o formato e a versão da tag
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/validar-tag.mjs "$TAG"

  instalador:
    name: Gerar o instalador (Windows)
    needs: validar
    # O `validar` só roda em tag. Em pull request ele é pulado e o instalador roda assim mesmo;
    # em tag, só roda se o `validar` passou.
    if: ${{ !cancelled() && (needs.validar.result == 'success' || needs.validar.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o pnpm (versão do campo packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Instalar o Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar o Rust estável
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Cache das dependências do Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Instalar as dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar o instalador
        run: pnpm tauri build

      - name: Conferir o instalador e o executável
        shell: pwsh
        run: |
          $instalador = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $instalador) { throw "O instalador não foi gerado." }
          node scripts/verificar-pacote.mjs $instalador.FullName src-tauri/target/release/memoteca.exe

      - name: Guardar o instalador
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instalador
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  publicar:
    name: Criar o rascunho da release
    needs: instalador
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Baixar o instalador
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: instalador
          path: instalador

      - name: Criar o rascunho da release com o instalador
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          arquivo=$(ls instalador/*.exe)
          soma=$(sha256sum "$arquivo" | cut -d' ' -f1)
          {
            cat .github/notas-da-release.md
            printf '\n**SHA-256 do instalador:** `%s`\n' "$soma"
          } > notas.md
          gh release create "$TAG" "$arquivo" \
            --draft --verify-tag \
            --title "Memoteca $TAG" \
            --notes-file notas.md
