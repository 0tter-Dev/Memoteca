[package]
name = "memoteca"
version = "0.1.0"
description = "Aplicativo desktop para organizar conversas e memória de modelos de linguagem locais."
authors = ["Memoteca contributors"]
license = "MIT"
repository = "https://github.com/0tter-Dev/Memoteca"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "memoteca_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Build dos testes ponta a ponta (E15): pasta de dados e janelas de arquivo escolhidas pelo
# teste, instalador e espaço em disco falsos. NUNCA entra no build de release (ver tests/ci.rs).
e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream", "system-proxy"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1.54.1", features = ["macros", "time", "rt", "sync", "fs", "io-util"] }
tokio-util = "0.7.20"
uuid = { version = "1.29.1", features = ["v7"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "time", "rt-multi-thread", "net", "io-util", "sync"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
